<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>网关调试 - Context7 号池网关</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-page="gateway">
    <main class="appShell">
      <aside class="sidebar">
        <div class="brand"><span class="brandMark">C7</span><div><strong>Context7 Gateway</strong><small>生产号池控制台</small></div></div>
        <nav class="navList" aria-label="主导航"><a href="/dashboard.html" data-nav="dashboard">运行总览</a><a href="/accounts.html" data-nav="accounts">账号池管理</a><a href="/gateway.html" data-nav="gateway">网关调试</a><a href="/security.html" data-nav="security">安全设置</a></nav>
        <div class="sidebarCard"><span class="statusDot"></span><div><strong>独立网关令牌</strong><small>使用 GATEWAY_TOKEN 调用</small></div></div>
      </aside>
      <section class="workspace">
        <header class="topbar"><div><p class="eyebrow">Gateway Debugger</p><h1>网关调试</h1><p class="subtitle">通过独立 GATEWAY_TOKEN 走号池代理调用 Context7 上游。</p></div></header>
        <section class="contentGrid">
          <section class="panel">
            <div class="panelHeader"><div><p class="sectionLabel">Gateway Access</p><h2>网关调用令牌</h2></div><span id="message" class="toast" role="status">等待操作</span></div>
            <form id="gatewayAuthForm" class="stackForm">
              <label>Gateway Token<input id="gatewayToken" name="gatewayToken" type="password" placeholder="输入 GATEWAY_TOKEN" autocomplete="off" /></label>
              <button type="submit">保存到本机浏览器</button>
            </form>
          </section>
          <section class="panel">
            <div class="panelHeader"><div><p class="sectionLabel">Request</p><h2>请求配置</h2></div></div>
            <form id="gatewayForm" class="stackForm">
              <div class="twoColumns"><label>请求方法<select name="method"><option value="GET">GET</option><option value="POST">POST</option><option value="PUT">PUT</option><option value="PATCH">PATCH</option><option value="DELETE">DELETE</option></select></label><label>上游路径<input name="path" value="/api/v2/libs/search?query=react" required /></label></div>
              <label>JSON 请求体<textarea name="body" rows="6" placeholder='POST 时填写，例如 {"libraryName":"react"}'></textarea></label>
              <button type="submit">通过号池代理调用</button>
            </form>
          </section>
        </section>
        <section class="panel resultPanel"><div class="panelHeader"><div><p class="sectionLabel">Response</p><h2>最近网关响应</h2></div></div><pre id="gatewayResult" class="result">暂无调用结果</pre></section>
      </section>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
